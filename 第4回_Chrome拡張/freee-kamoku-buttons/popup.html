<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>freee勘定科目ボタン設定</title>
<style>
  /* freee会計（vibes）の実測トークンに合わせた配色 */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", Arial, メイリオ, Meiryo, sans-serif;
    width: 260px;
    padding: 12px;
    margin: 0;
    color: #323232;
  }
  h1 {
    font-size: 13px;
    font-weight: 700;
    color: #285ac8;
    margin: 0 0 8px;
  }
  p.fkb-desc {
    font-size: 11px;
    color: #666;
    margin: 0 0 8px;
    line-height: 1.5;
  }
  textarea {
    width: 100%;
    height: 160px;
    box-sizing: border-box;
    font-size: 13px;
    padding: 8px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
    color: #323232;
  }
  textarea:focus {
    outline: none;
    border-color: #285ac8;
  }
  .fkb-actions {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 16px;
    border: none;
    border-radius: 8px;
    background: #285ac8;
    color: #fff;
    cursor: pointer;
  }
  button:hover {
    background: #1e4aa8;
  }
  #fkb-status {
    font-size: 11px;
    color: #285ac8;
    font-weight: 700;
  }
  #fkb-error {
    font-size: 11px;
    color: #dc2626;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>勘定科目ボタン設定</h1>
  <p class="fkb-desc">1行に1科目、最大10件まで入力してね。保存するとfreeeの画面にすぐ反映されるよ。</p>
  <textarea id="fkb-textarea"></textarea>
  <div class="fkb-actions">
    <button id="fkb-save">保存</button>
    <span id="fkb-status"></span>
  </div>
  <div id="fkb-error"></div>
  <script src="popup.js"></script>
</body>
</html>
