<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顧客管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; }
  header { background: #fff; border-bottom: 1px solid #ddd; padding: 8px 16px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .add-btn { padding: 4px 12px; background: #1a56db; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  /* 凡例ポップアップ */
  .legend-wrap { position: relative; }
  .legend-btn { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .legend-popup { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px; z-index: 300; box-shadow: 0 4px 12px rgba(0,0,0,.12); min-width: 160px; }
  .legend-popup.open { display: flex; flex-direction: column; gap: 6px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
  .table-wrap { overflow: auto; max-height: calc(100vh - var(--header-h, 57px)); padding: 12px 20px; }
  table { border-collapse: collapse; min-width: 900px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  thead th { background: #f8f9fa; font-size: 12px; font-weight: 600; padding: 8px 10px; border: 1px solid #e5e7eb; text-align: center; position: sticky; top: 0; z-index: 10; }
  thead th:first-child { text-align: left; width: 220px; min-width: 220px; max-width: 220px; }
  tbody tr { cursor: pointer; transition: background .15s; }
  tbody tr:hover { background: #f0f4ff; }
  tbody td { border: 1px solid #e5e7eb; padding: 6px 10px; font-size: 13px; vertical-align: middle; }
  tbody td:first-child { max-width: 220px; }
  .current-month { background: #e0f2fe !important; }
  thead th.current-month { background: #bae6fd !important; }
  .dots { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; cursor: default; flex-shrink: 0; }
  .task-label { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: #93c5fd; color: #1e3a8a; white-space: nowrap; cursor: default; font-weight: 600; }

  .task-label-done { background: #cbd5e1; color: #475569; }
  .status-badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: #e5e7eb; margin-left: 4px; }
  .status-進行中 { background: #dbeafe; color: #1e40af; }
  .status-回答待ち { background: #fef3c7; color: #92400e; }
  .status-完了 { background: #d1fae5; color: #065f46; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal { background:#fff; border-radius:10px; padding:24px; min-width:340px; max-width:480px; width:90%; }
  .modal h2 { font-size:16px; margin-bottom:16px; }
  .form-row { margin-bottom:12px; }
  .form-row label { display:block; font-size:12px; margin-bottom:4px; color:#555; }
  .form-row input, .form-row select, .form-row textarea { width:100%; border:1px solid #ccc; border-radius:4px; padding:7px 10px; font-size:13px; }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .btn-cancel { padding:6px 16px; border:1px solid #ccc; border-radius:4px; background:#fff; cursor:pointer; }
  .btn-save { padding:6px 16px; background:#1a56db; color:#fff; border:none; border-radius:4px; cursor:pointer; }
  .search-box { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; min-width: 120px; }
  .search-wrap { position: relative; }
  .search-suggest { position: absolute; top: calc(100% + 2px); left: 0; min-width: 220px; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 200; display: none; max-height: 320px; overflow-y: auto; }
  .search-suggest.open { display: block; }
  .suggest-item { padding: 6px 10px; font-size: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
  .suggest-item:hover, .suggest-item.selected { background: #ecfeff; }
  .suggest-cat { font-size: 10px; color: #888; margin-left: auto; }
  .client-count { font-size: 12px; color: #555; white-space: nowrap; }
  .month-count { display: block; font-size: 10px; color: #888; font-weight: 400; margin-top: 2px; }
  thead th.current-month .month-count { color: #0e7490; }
  .filter-btns { display: flex; gap: 3px; }
  .filter-btn { padding: 3px 9px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .filter-btn.active { background: #0e7490; color: #fff; border-color: #0e7490; }
  .cal-toggle-btn { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .cal-toggle-btn.active { background: #0e7490; color: #fff; border-color: #0e7490; }
  .header-spacer { flex: 1; }
  /* 開始月ピッカー */
  .start-month-wrap { display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
  .start-month-wrap select { padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
  /* Notionリンク・チャットボタン */

  .notion-link { color: #bbb; text-decoration: none; margin-left: 4px; flex-shrink: 0; display: inline-flex; align-items: center; opacity: 0; transition: opacity .15s; }

  /* Main layout */

<body>

<header>
  <h1>顧客管理</h1>
  <div class="search-wrap">
    <input class="search-box" id="search-box" type="text" placeholder="顧問先を検索..." autocomplete="off"
      oninput="filterClients(this.value)" onkeydown="suggestKeydown(event)"
      onfocus="updateSuggest(this.value)" onblur="closeSuggest()" />
    <div class="search-suggest" id="search-suggest"></div>
  </div>
  <div class="filter-btns">
    <button class="filter-btn" data-cat="" onclick="setCategory(null, this)">全て</button>
    <button class="filter-btn active" data-cat="法人" onclick="setCategory('法人', this)">法人</button>
    <button class="filter-btn" data-cat="個人" onclick="setCategory('個人', this)">個人</button>
    <button class="filter-btn" data-cat="コンサル" onclick="setCategory('コンサル', this)">コンサル</button>
  </div>
  <span class="header-spacer"></span>
  <div class="start-month-wrap">
    <label for="start-month-sel">開始月:</label>
    <select id="start-month-sel" onchange="setStartMonth(parseInt(this.value))">
      <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
      <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
      <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
      <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
    </select>
  </div>
  <span class="client-count" id="client-count"></span>
  <div class="legend-wrap">
    <button class="legend-btn" id="legend-btn" onclick="toggleLegend()">凡例 ▾</button>
    <div class="legend-popup" id="legend-popup">
      <div class="legend-item"><span class="legend-dot" style="background:#1a56db"></span>決算期</div>
      <div class="legend-item"><span class="legend-dot" style="background:#93c5fd"></span>申告</div>
      <div class="legend-item"><span class="legend-dot" style="background:#16a34a"></span>予定納税</div>
      <div class="legend-item"><span class="legend-dot" style="background:#fb923c"></span>源泉所得税納付</div>
      <div class="legend-item"><span class="legend-dot" style="background:purple"></span>年末調整</div>
      <div class="legend-item"><span class="legend-dot" style="background:#888"></span>スポット</div>
    </div>
  </div>
  <a class="freee-header-btn" href="https://secure.freee.co.jp/" target="_blank" rel="noopener">freee</a>
  <button class="sync-btn" id="sync-btn" onclick="syncData()">🔄 Notion同期</button>
  <button class="relation-badge" id="relation-badge" onclick="openRelationModal()"></button>
  <button class="cal-toggle-btn active" id="cal-toggle-btn" onclick="toggleCal()">📅 カレンダー</button>
</header>
<div class="toast" id="toast"></div>

<div class="main-layout">
<div class="table-wrap">
  <table id="main-table">
    <thead>
      <tr id="table-head-row">
        <th>顧問先</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div><!-- /table-wrap -->

<div class="cal-panel" id="cal-panel">
  <div class="cal-panel-header">
    <span>Googleカレンダー</span>
    <button class="cal-close-btn" onclick="toggleCal()">✕</button>
  </div>
  <iframe
    src="https://calendar.google.com/calendar/embed?src=YOUR_CALENDAR_ID%40gmail.com&ctz=Asia%2FTokyo&hl=ja&mode=AGENDA"
    title="Googleカレンダー"
  ></iframe>
</div>
</div><!-- /main-layout -->

<!-- Add Task Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>スポットタスク追加</h2>
    <div class="form-row">
      <label>顧問先</label>
      <select id="modal-client">
        <!-- data.json から自動生成 -->
      </select>
    </div>
    <div class="form-row">
      <label>タスク名</label>
      <input type="text" id="modal-title" placeholder="例: 書類提出" />
    </div>
    <div class="form-row">
      <label>月 (1-12)</label>
      <input type="number" id="modal-month" min="1" max="12" value="1" />
    </div>
    <div class="form-row">
      <label>メモ</label>
      <textarea id="modal-note" rows="2" placeholder="備考など"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveSpot()">追加</button>
    </div>
  </div>
</div>

<!-- Relation Suggestions Modal -->
<div class="modal-overlay" id="relation-modal">
  <div class="modal" style="max-width:560px;">
    <h2>議事録 未紐づけ候補</h2>
    <div id="relation-list" style="max-height:360px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRelationModal()">閉じる</button>
      <button class="btn-save" id="relation-apply-btn" onclick="applyRelationSuggestions()">一括適用</button>
    </div>
  </div>
</div>

  const overrides = getIdOverrides();

function mergeLocalStorage() {

  spots.forEach(s => {
    const c = allClients.find(x => x.id === s.client_id);
    if (c) {
      const exists = c.tasks.some(t => t.id === s.id);
      if (!exists) {
        c.tasks.push({ ...s, type: 'spot', color: '#888', status: 'todo' });
      }
    }
  });

  // ステータス上書き
  const statuses = JSON.parse(localStorage.getItem('task_statuses') || '{}');
  allClients.forEach(c => {
    c.tasks.forEach(t => {
      const key = c.id + ':' + t.id;
      if (statuses[key]) t.status = statuses[key];
    });
  });
}

// ---- 検索候補プルダウン（候補クリックで一覧を絞り込み）----
let suggestIndex = -1;

function updateSuggest(v) {
  const el = document.getElementById('search-suggest');
  const q = (v || '').trim().toLowerCase();
  suggestIndex = -1;
  el.innerHTML = '';
  if (!q) { el.classList.remove('open'); return; }
  const matches = allClients
    .filter(c => c.name.toLowerCase().includes(q) || (c.formal_name || '').toLowerCase().includes(q))
    .slice(0, 8);
  if (!matches.length) { el.classList.remove('open'); return; }
  matches.forEach(c => {
    const d = document.createElement('div');
    d.className = 'suggest-item';
    const name = document.createElement('span');
    name.textContent = c.name;
    const cat = document.createElement('span');
    cat.className = 'suggest-cat';
    cat.textContent = c.category || '';
    d.appendChild(name);
    d.appendChild(cat);
    // blurより先に発火させるためmousedownで処理する
    d.onmousedown = (e) => {
      e.preventDefault();
      const box = document.getElementById('search-box');
      box.value = c.name;
      filterText = c.name.toLowerCase();
      sessionStorage.setItem('cal_search_text', c.name);
      renderTable();
      closeSuggest();
    };
    el.appendChild(d);
  });
  el.classList.add('open');
}

function closeSuggest() {
  const el = document.getElementById('search-suggest');
  el.classList.remove('open');
  suggestIndex = -1;
}

function suggestKeydown(e) {
  const el = document.getElementById('search-suggest');
  const items = el.querySelectorAll('.suggest-item');
  if (!el.classList.contains('open') || !items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestIndex = (suggestIndex + 1) % items.length;
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestIndex = (suggestIndex - 1 + items.length) % items.length;
  } else if (e.key === 'Enter') {
    if (suggestIndex >= 0) {
      e.preventDefault();
      items[suggestIndex].dispatchEvent(new MouseEvent('mousedown', {cancelable: true}));
    }
    return;
  } else if (e.key === 'Escape') {
    closeSuggest();
    return;
  } else {
    return;
  }
  items.forEach((it, i) => it.classList.toggle('selected', i === suggestIndex));
  items[suggestIndex].scrollIntoView({block: 'nearest'});
}

function fiscalSortKey(c) {
  // 申告期限（決算月+2ヶ月）が近い順。開始月が7月なら5月決算（期限7月末）が最上位
  const m = c.fiscal_month;
  return m ? (m - startMonth + 2 + 12) % 12 : 99;
}

// startMonthから始まる12ヶ月順の配列を返す
function monthOrder() {
  return Array.from({length: 12}, (_, i) => (startMonth - 1 + i) % 12 + 1);
}

function renderTable() {
  const months = monthOrder();

  // ヘッダー再描画
  const headRow = document.getElementById('table-head-row');
  headRow.innerHTML = '<th>顧問先</th>';
  months.forEach(m => {
    const th = document.createElement('th');
    if (m === currentMonth) th.classList.add('current-month');
    th.innerHTML = `${m}月<span class="month-count" id="mc-${m}"></span>`;
    headRow.appendChild(th);
  });

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  const filtered = allClients
    .filter(c => !filterText || c.name.toLowerCase().includes(filterText) || (c.formal_name || '').toLowerCase().includes(filterText))
    .filter(c => !filterCategory || c.category === filterCategory)
    .sort((a, b) => fiscalSortKey(a) - fiscalSortKey(b));

  // 顧問先数を更新
  document.getElementById('client-count').textContent = filtered.length + '社';

  // 月別申告件数を更新
  months.forEach(m => {
    const cnt = filtered.filter(c => c.tasks.some(t => t.month === m && t.type === 'kessan_mark')).length;
    const el = document.getElementById('mc-' + m);
    if (el) el.textContent = cnt > 0 ? cnt + '件' : '';
  });

  filtered.forEach(client => {
    const tr = document.createElement('tr');
    tr.onclick = () => { saveViewState(); window.location.href = 'clients/' + client.id + '.html'; };

    // 名前セル
    const nameCell = document.createElement('td');
    const notionId = client.id.replace(/-/g, '');
    const chatUrl = getChatUrl(client.id);
    const unprocessedCount = freeeUnprocessed[client.id];
    const unprocessedBadge = (unprocessedCount > 0)
      ? `<span class="unprocessed-badge${unprocessedCount >= 10 ? ' high' : ''}" title="freee未処理明細 ${unprocessedCount}件">未${unprocessedCount}</span>`
      : '';
    nameCell.innerHTML = `<div class="name-cell-inner"><span class="name-text" title="${client.formal_name || client.name}">${client.name}</span>${unprocessedBadge}<a class="notion-link" href="https://www.notion.so/${notionId}" target="_blank" onclick="event.stopPropagation()" title="Notionで開く"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="16" height="16" rx="2.5" fill="currentColor" opacity="0.12"/><path d="M3.5 3h5.2l4.3 5.8V13h-1.5V9.5L7.8 4.5H5v8.5H3.5V3z" fill="currentColor"/></svg></a><button class="chat-btn${chatUrl ? ' has-url' : ''}" onclick="event.stopPropagation();openChat('${client.id}',this,event)" title="${chatUrl ? '連絡チャンネルを開く（Shift+クリックで変更）' : '連絡チャンネルを設定'}"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M1.5 5.5l6.5 4.5 6.5-4.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>${accountingButtonHtml(client)}${etaxButtonHtml(client)}${eltaxButtonHtml(client)}</div>`;
    tr.appendChild(nameCell);

    // 月別セル（startMonth順）
    months.forEach(m => {
      const td = document.createElement('td');
      if (m === currentMonth) td.classList.add('current-month');
      const monthTasks = client.tasks.filter(t => t.month === m);
      if (monthTasks.length > 0) {
        const dotsDiv = document.createElement('div');
        dotsDiv.className = 'dots';
        monthTasks.forEach(t => {
          const isDone = t.status === 'done';
          if (t.type === 'kessan') {
            const label = document.createElement('span');
            label.className = 'task-label';
            label.textContent = '申告';
            label.title = t.title + (isDone ? ' ✓' : '');
            if (isDone) label.style.opacity = '0.4';
            // calendar-tasks.json（サーバー保存の個別詳細ページ側完了状況）で申告タスクが完了していれば追加表示
            const kessanKey = client.id + ':' + client.id.slice(0, 8) + '-kessan-' + m;
            if (calendarTaskStatuses[kessanKey] === 'done') {
              label.classList.add('task-label-done');
              label.textContent = '申告 ✓';
              label.title = t.title + '（完了）';
            }
            dotsDiv.appendChild(label);
          } else {
            const dot = document.createElement('span');
            dot.className = 'dot';
            dot.style.background = TYPE_COLOR[t.type] || t.color || '#aaa';
            dot.title = t.title + (isDone ? ' ✓' : '');
            if (isDone) dot.style.opacity = '0.4';
            dotsDiv.appendChild(dot);
          }
        });
        td.appendChild(dotsDiv);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

    color: '#888',
    status: 'todo',

  spots.push(spot);
  localStorage.setItem('spot_tasks', JSON.stringify(spots));

  // サーバー（calendar-tasks.json）へも保存。spot_tasksはID単位の和集合、
  // task_statusesはサーバー優先マージで全量POST（詳細ページ側の完了状態を消さないため）
  const spotMap = new Map();
  calendarSpotTasks.forEach(s => spotMap.set(s.id, s));
  spots.forEach(s => spotMap.set(s.id, s));
  calendarSpotTasks = Array.from(spotMap.values());
  const localStatuses = JSON.parse(localStorage.getItem('task_statuses') || '{}');
  fetch(SYNC_SERVER + '/api/calendar-tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      task_statuses: { ...localStatuses, ...calendarTaskStatuses },
      spot_tasks: calendarSpotTasks,
    }),
  }).catch(() => {
    // サーバー不達時はlocalStorageのみ（詳細ページを開いたときにマイグレーションされる）
  });

  const c = allClients.find(x => x.id === clientId);
  if (c) c.tasks.push(spot);
  renderTable();
  closeModal();
}

// チャットURL永続化（dashboard server.py経由でchat-urls.jsonに保存）
const SYNC_SERVER = 'http://localhost:3460';
const chatUrlCache = {};

async function loadChatUrls() {
  try {
    const res = await fetch(SYNC_SERVER + '/chat-urls');
    if (res.ok) {
      const serverMap = await res.json();

      // localStorageにある未移行データをサーバーへ同期（初回移行）
      const toMigrate = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('chat_url_')) {
          const id = key.replace('chat_url_', '');
          if (!serverMap[id]) {
            const url = localStorage.getItem(key);
            if (url) toMigrate[id] = url;
          }
        }
      }
      if (Object.keys(toMigrate).length > 0) {
        for (const [id, url] of Object.entries(toMigrate)) {
          serverMap[id] = url;
          fetch(SYNC_SERVER + '/chat-urls', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clientId: id, url }),
          }).catch(() => {});
        }
      }

      Object.assign(chatUrlCache, serverMap);
      for (const [id, url] of Object.entries(serverMap)) {
        localStorage.setItem('chat_url_' + id, url);
      }
    }
  } catch (e) {
    // dashboard server.pyが起動していない場合はlocalStorageのみ使用
  }
}

function getChatUrl(clientId) {
  return chatUrlCache[clientId] || localStorage.getItem('chat_url_' + clientId) || '';
}

async function saveChatUrl(clientId, url) {
  if (url) {
    chatUrlCache[clientId] = url;
    localStorage.setItem('chat_url_' + clientId, url);
  } else {
    delete chatUrlCache[clientId];
    localStorage.removeItem('chat_url_' + clientId);
  }
  try {
    await fetch(SYNC_SERVER + '/chat-urls', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId, url: url || '' }),
    });
  } catch (e) {
    // dashboard server.pyが起動していない場合はlocalStorageのみ
  }
}

// チャットチャンネル開く
function openChat(clientId, btn, event) {
  const url = getChatUrl(clientId);
  if (url && !event.shiftKey && !event.ctrlKey) {
    window.open(url, '_blank');
  } else {
    const input = prompt('チャンネルURLを入力\n（Slack・Chatwork・LINE・Gmail等、何でもOK）\n\nShift+クリックでいつでも変更できます。\n空欄で送信するとURLを削除します:', url || '');
    if (input === null) return;
    saveChatUrl(clientId, input.trim());
    if (input.trim()) {
      btn.classList.add('has-url');
      btn.title = '連絡チャンネルを開く（Shift+クリックで変更）';
    } else {
      btn.classList.remove('has-url');
      btn.title = '連絡チャンネルを設定';
    }
  }
}

// localStorageのチャットURLを全件サーバーへ移行
async function migrateChatUrls() {
  const entries = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('chat_url_')) {
      const id = key.replace('chat_url_', '');
      const url = localStorage.getItem(key);
      if (url) entries.push({ clientId: id, url });
    }
  }
  if (entries.length === 0) {
    showToast('移行するリンクがありません');
    return;
  }
  const btn = document.getElementById('migrate-btn');
  btn.disabled = true;
  btn.textContent = '移行中...';
  let ok = 0, fail = 0;
  for (const e of entries) {
    try {
      const res = await fetch('http://localhost:3460/chat-urls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(e),
      });
      if (res.ok) ok++; else fail++;
    } catch {
      fail++;
    }
  }
  btn.disabled = false;
  btn.textContent = '💬 リンク移行';
  if (fail === 0) {
    showToast(`✅ ${ok}件のリンクをサーバーに保存しました`);
  } else {
    showToast(`⚠️ ${ok}件成功 / ${fail}件失敗（サーバー起動確認してね）`);
  }
}

// calendar-tasks.json（サーバー保存のtask_statuses・spot_tasks）。
// task_statusesは申告セルの完了マーク表示、spot_tasksは一覧セルへのスポット表示に使う
let calendarTaskStatuses = {};
let calendarSpotTasks = [];

async function loadCalendarTaskStatuses() {
  try {
    const res = await fetch(SYNC_SERVER + '/api/calendar-tasks');
    if (res.ok) {
      const data = await res.json();
      calendarTaskStatuses = data.task_statuses || {};
      calendarSpotTasks = data.spot_tasks || [];
    }
  } catch (e) {
    // サーバー不達時・calendar-tasks.json未生成時は現状の表示を維持（フォールバック）
  }
}

// サーバー保存分をallClientsへ反映（localStorage分はmergeLocalStorage済み。ステータスはサーバー優先）
function mergeServerCalendarTasks() {
  calendarSpotTasks.forEach(s => {
    const c = allClients.find(x => x.id === s.client_id);
    if (c && !c.tasks.some(t => t.id === s.id)) {
      c.tasks.push({ ...s, type: 'spot', color: '#888' });
    }
  });
  allClients.forEach(c => {
    c.tasks.forEach(t => {
      const key = c.id + ':' + t.id;
      if (calendarTaskStatuses[key]) t.status = calendarTaskStatuses[key];
    });
  });
}

// 議事録 未紐づけ候補（relation_suggestions.json。generate.pyのSTEP2.6で更新される）
let relationSuggestions = [];

async function loadRelationSuggestions() {
  try {
    const res = await fetch('/ops/tools/client-calendar/relation_suggestions.json?t=' + Date.now());
    if (res.ok) relationSuggestions = await res.json();
  } catch (e) {
    relationSuggestions = [];
  }
  updateRelationBadge();
}

function updateRelationBadge() {
  const badge = document.getElementById('relation-badge');
  if (relationSuggestions.length > 0) {
    badge.textContent = `議事録 未紐づけ${relationSuggestions.length}件`;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

function openRelationModal() {
  const list = document.getElementById('relation-list');
  list.innerHTML = '';
  if (relationSuggestions.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'font-size:12px; color:#888;';
    empty.textContent = '未紐づけ候補はありません';
    list.appendChild(empty);
  } else {
    relationSuggestions.forEach(s => {
      const item = document.createElement('div');
      item.style.cssText = 'border:1px solid #e5e7eb; border-radius:6px; padding:8px 10px; font-size:12px;';
      const title = document.createElement('div');
      title.style.fontWeight = '600';
      title.textContent = s.title || '（無題ミーティング）';
      const detail = document.createElement('div');
      detail.style.cssText = 'color:#666; margin-top:2px;';
      detail.textContent = `${s.date || ''} → ${s.client_name}（${s.reason}）`;
      item.appendChild(title);
      item.appendChild(detail);
      list.appendChild(item);
    });
  }
  document.getElementById('relation-modal').classList.add('open');
}

function closeRelationModal() {
  document.getElementById('relation-modal').classList.remove('open');
}

async function applyRelationSuggestions() {
  const btn = document.getElementById('relation-apply-btn');
  const origLabel = btn.textContent;
  btn.textContent = '適用中...';
  btn.disabled = true;
  try {
    const res = await fetch(SYNC_SERVER + '/api/relation-suggestions/apply', { method: 'POST' });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || '一括適用に失敗しました');
    showToast('議事録の紐づけを一括適用しました');
    closeRelationModal();
    setTimeout(() => window.location.reload(), 800);
  } catch (e) {
    showToast('一括適用エラー: ' + e.message, true);
    btn.textContent = origLabel;
    btn.disabled = false;
  }
}
